docs_dir: docs

site_dir: site

site_name: 量子计算导论
site_description: 从基础数学到量子硬件的系统性量子计算教程
site_author: quantum-computing-textbook
site_url: https://jialezhouxin.github.io/quantum-computing-textbook/
repo_url: https://github.com/JialeZhouxin/quantum-computing-textbook
repo_name: JialeZhouxin/quantum-computing-textbook
edit_uri: edit/master/docs/
copyright: CC BY-NC 4.0

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: black
      accent: teal
      toggle:
        icon: material/weather-night
        name: 深色模式
    - scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: 浅色模式
  font:
    text: Lora
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.annotate
    - content.copy

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/JialeZhouxin/quantum-computing-textbook
  generator: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - minify:
      minify_html: true

